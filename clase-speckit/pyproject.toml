[project]
name = "organizador-tareas"
version = "0.1.0"
description = "Organizador de tareas académicas para estudiantes de la UPB"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
